; DevBootstrapper Configuration File
; ─────────────────────────────────────────────────────────────────────────────
; Edit this file to pre-populate wizard defaults.
; Run with --silent to skip the wizard entirely and install from this file.
; Choose [1] Automatic Install in the wizard to use these settings without prompts.
;
; Boolean values: true / false
; ─────────────────────────────────────────────────────────────────────────────

[General]
; Default working directory for repositories
WorkingDirectory=C:\Work

; Package provider: AutoDetect, Winget, or Chocolatey
PackageProvider=AutoDetect

; Silent install – suppresses interactive UI in package installers
; Set to true for unattended/CI runs
SilentInstall=false

[VisualStudio]
; Edition: Community, Professional, or Skip
Edition=Community
; Version: VS2019 or VS2022
Version=VS2022

[Rider]
; Install JetBrains Rider: true or false
Install=true
; Version: "latest" or a specific version such as 2024.3
Version=latest

[Git]
; Install Git if not already present: true or false
Install=true

[DotNetFramework48]
; Install .NET Framework 4.8 if not already present: true or false
Install=true

[AdditionalPackages]
; List extra winget package IDs to install after the standard tools.
; Add Package<N> = <winget-id> lines (N = 1, 2, 3, …).
; Find IDs with: winget search <name>   or   https://winget.run
Package1=Microsoft.PowerShell
Package2=Microsoft.WindowsTerminal
Package3=Notepad++.Notepad++
Package4=Docker.DockerDesktop
Package5=Postman.Postman

[WingetPackageIds]
; Override the winget package IDs used for each known tool.
; Remove or comment out any line to revert to the built-in default.
; These IDs are looked up at: https://winget.run  or  winget search <name>
Git=Git.Git
DotNetFramework48=Microsoft.DotNet.Framework.DeveloperPack_4
Rider=JetBrains.Rider
VisualStudio2022Community=Microsoft.VisualStudio.2022.Community
VisualStudio2022Professional=Microsoft.VisualStudio.2022.Professional
VisualStudio2019Community=Microsoft.VisualStudio.2019.Community
VisualStudio2019Professional=Microsoft.VisualStudio.2019.Professional
