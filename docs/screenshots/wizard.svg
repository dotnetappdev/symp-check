<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480">
  <defs>
    <style>
      .terminal { font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace; font-size: 14px; }
      .bg { fill: #0C0C0C; }
      .cyan { fill: #00D7D7; }
      .yellow { fill: #FFD700; }
      .white { fill: #F8F8F8; }
      .green { fill: #16C60C; }
      .gray { fill: #888888; }
      .dark-gray { fill: #555555; }
      .prompt-arrow { fill: #16C60C; }
    </style>
  </defs>

  <!-- Terminal window background -->
  <rect width="800" height="480" class="bg" rx="8"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="28" fill="#2D2D2D" rx="8"/>
  <rect x="0" y="14" width="800" height="14" fill="#2D2D2D"/>
  <circle cx="20" cy="14" r="6" fill="#FF5F57"/>
  <circle cx="42" cy="14" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="14" r="6" fill="#28C840"/>
  <text x="400" y="19" text-anchor="middle" fill="#AAAAAA" font-family="Segoe UI, sans-serif" font-size="12">DevBootstrapper — Developer Environment Bootstrapper</text>

  <!-- Content area -->
  <g class="terminal" transform="translate(20, 50)">

    <!-- Banner box -->
    <text y="14" class="cyan">╔══════════════════════════════════════════════════╗</text>
    <text y="32" class="yellow">║       Developer Environment Bootstrapper         ║</text>
    <text y="50" class="cyan">╚══════════════════════════════════════════════════╝</text>

    <!-- Separator -->
    <text y="78" class="dark-gray">────────────────────────────────────────────────────</text>
    <text y="96" class="yellow">  Step 1</text><text x="84" y="96" class="dark-gray"> ── </text><text x="110" y="96" class="cyan">Select Environment</text>
    <text y="114" class="dark-gray">────────────────────────────────────────────────────</text>

    <!-- Question -->
    <text y="138" class="white">Which environment would you like to set up?</text>
    <text y="160" class="yellow">  </text>

    <!-- Menu choices -->
    <text y="160" class="yellow">  [1]</text><text x="50" y="160" class="white">  </text><text x="68" y="160" class="cyan">Symphony Messenger</text>
    <text y="180" class="yellow">  [2]</text><text x="50" y="180" class="white">  </text><text x="68" y="180" class="cyan">Custom</text>

    <!-- Prompt -->
    <text y="210" class="prompt-arrow">  ❯ </text><text x="40" y="210" class="white">Choice: </text>
    <text x="116" y="210" class="white">1</text>
    <rect x="124" y="199" width="2" height="14" fill="#F8F8F8" opacity="0.8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

  </g>
</svg>
