<svg xmlns="http://www.w3.org/2000/svg" width="800" height="580" viewBox="0 0 800 580">
  <defs>
    <style>
      .terminal { font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace; font-size: 14px; }
      .bg { fill: #0C0C0C; }
      .cyan { fill: #00D7D7; }
      .yellow { fill: #FFD700; }
      .white { fill: #F8F8F8; }
      .green { fill: #16C60C; }
      .gray { fill: #888888; }
      .dark-gray { fill: #555555; }
      .prompt-arrow { fill: #16C60C; }
    </style>
  </defs>

  <!-- Terminal window background -->
  <rect width="800" height="580" class="bg" rx="8"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="28" fill="#2D2D2D" rx="8"/>
  <rect x="0" y="14" width="800" height="14" fill="#2D2D2D"/>
  <circle cx="20" cy="14" r="6" fill="#FF5F57"/>
  <circle cx="42" cy="14" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="14" r="6" fill="#28C840"/>
  <text x="400" y="19" text-anchor="middle" fill="#AAAAAA" font-family="Segoe UI, sans-serif" font-size="12">DevBootstrapper — Developer Environment Bootstrapper</text>

  <!-- Content area -->
  <g class="terminal" transform="translate(20, 50)">

    <!-- Banner box -->
    <text y="14" class="cyan">╔══════════════════════════════════════════════════╗</text>
    <text y="32" class="yellow">║       Developer Environment Bootstrapper         ║</text>
    <text y="50" class="cyan">╚══════════════════════════════════════════════════╝</text>

    <!-- Launch mode prompt -->
    <text y="80" class="white">  How would you like to proceed?</text>
    <text y="106" class="yellow">  [1]</text><text x="50" y="106" class="white">  </text><text x="68" y="106" class="cyan">Automatic Install  — install all tools from bootstrapper.ini without prompts</text>
    <text y="126" class="yellow">  [2]</text><text x="50" y="126" class="white">  </text><text x="68" y="126" class="cyan">Interactive Setup  — configure step-by-step with the guided wizard</text>

    <text y="152" class="prompt-arrow">  ❯ </text><text x="40" y="152" class="white">Choice: </text>
    <text x="116" y="152" class="white">1</text>

    <!-- Automatic Install summary -->
    <text y="180" class="dark-gray">────────────────────────────────────────────────────</text>
    <text y="198" class="green">  ✓  </text><text x="46" y="198" class="cyan">Automatic Install selected</text>
    <text y="216" class="dark-gray">────────────────────────────────────────────────────</text>

    <text y="242" class="white">  Tools to install:</text>
    <text y="264" class="green">    ✓ </text><text x="56" y="264" class="cyan">Visual Studio Community 2022</text><text x="266" y="264" class="dark-gray">  (Microsoft.VisualStudio.2022.Community)</text>
    <text y="284" class="green">    ✓ </text><text x="56" y="284" class="cyan">JetBrains Rider (latest)</text><text x="222" y="284" class="dark-gray">  (JetBrains.Rider)</text>
    <text y="304" class="green">    ✓ </text><text x="56" y="304" class="cyan">.NET Framework 4.8</text><text x="180" y="304" class="dark-gray">  (Microsoft.DotNet.Framework.DeveloperPack_4)</text>
    <text y="324" class="green">    ✓ </text><text x="56" y="324" class="cyan">Git</text><text x="74" y="324" class="dark-gray">  (Git.Git)</text>

    <text y="350" class="white">  Additional packages:</text>
    <text y="372" class="green">    ✓ </text><text x="56" y="372" class="cyan">Microsoft.PowerShell</text>
    <text y="392" class="green">    ✓ </text><text x="56" y="392" class="cyan">Microsoft.WindowsTerminal</text>

    <text y="420" class="gray">  Working directory: </text><text x="164" y="420" class="cyan">C:\Work</text>
    <text y="440" class="gray">  Silent install:    </text><text x="164" y="440" class="cyan">No</text>

    <text y="468" class="prompt-arrow">  ❯ </text><text x="40" y="468" class="white">Proceed with installation? </text><text x="260" y="468" class="yellow">[Y/n]</text><text x="310" y="468" class="white">: </text>
    <rect x="322" y="457" width="2" height="14" fill="#F8F8F8" opacity="0.8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

  </g>
</svg>
