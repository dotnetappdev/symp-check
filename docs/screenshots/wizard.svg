<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560">
  <defs>
    <style>
      .terminal { font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace; font-size: 14px; }
      .bg { fill: #0C0C0C; }
      .cyan { fill: #00D7D7; }
      .yellow { fill: #FFD700; }
      .white { fill: #F8F8F8; }
      .green { fill: #16C60C; }
      .gray { fill: #888888; }
      .dark-gray { fill: #555555; }
      .prompt-arrow { fill: #16C60C; }
    </style>
  </defs>

  <!-- Terminal window background -->
  <rect width="800" height="560" class="bg" rx="8"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="800" height="28" fill="#2D2D2D" rx="8"/>
  <rect x="0" y="14" width="800" height="14" fill="#2D2D2D"/>
  <circle cx="20" cy="14" r="6" fill="#FF5F57"/>
  <circle cx="42" cy="14" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="14" r="6" fill="#28C840"/>
  <text x="400" y="19" text-anchor="middle" fill="#AAAAAA" font-family="Segoe UI, sans-serif" font-size="12">DevBootstrapper — Developer Environment Bootstrapper</text>

  <!-- Content area -->
  <g class="terminal" transform="translate(20, 50)">

    <!-- Banner box -->
    <text y="14" class="cyan">╔══════════════════════════════════════════════════╗</text>
    <text y="32" class="yellow">║       Developer Environment Bootstrapper         ║</text>
    <text y="50" class="cyan">╚══════════════════════════════════════════════════╝</text>

    <!-- Step 5 header -->
    <text y="82" class="dark-gray">────────────────────────────────────────────────────</text>
    <text y="100" class="yellow">  Step 5</text><text x="90" y="100" class="dark-gray"> ── </text><text x="116" y="100" class="cyan">Visual Studio</text>
    <text y="118" class="dark-gray">────────────────────────────────────────────────────</text>

    <!-- VS edition question -->
    <text y="142" class="white">Install Visual Studio?</text>
    <text y="164" class="yellow">  [1]</text><text x="50" y="164" class="white">  </text><text x="68" y="164" class="cyan">Community</text>
    <text y="184" class="yellow">  [2]</text><text x="50" y="184" class="white">  </text><text x="68" y="184" class="cyan">Professional</text>
    <text y="204" class="yellow">  [3]</text><text x="50" y="204" class="white">  </text><text x="68" y="204" class="cyan">Skip</text>

    <text y="228" class="prompt-arrow">  ❯ </text><text x="40" y="228" class="white">Choice: </text>
    <text x="116" y="228" class="white">1</text>

    <!-- VS version sub-prompt -->
    <text y="258" class="white">  Which Visual Studio release year?</text>
    <text y="278" class="yellow">  [1]</text><text x="50" y="278" class="white">  </text><text x="68" y="278" class="cyan">2019</text>
    <text y="298" class="yellow">  [2]</text><text x="50" y="298" class="white">  </text><text x="68" y="298" class="cyan">2022  (recommended)</text>

    <text y="322" class="prompt-arrow">  ❯ </text><text x="40" y="322" class="white">Choice: </text>
    <text x="116" y="322" class="white">2</text>

    <!-- Step 6 header (Rider) -->
    <text y="352" class="dark-gray">────────────────────────────────────────────────────</text>
    <text y="370" class="yellow">  Step 6</text><text x="90" y="370" class="dark-gray"> ── </text><text x="116" y="370" class="cyan">JetBrains Rider</text>
    <text y="388" class="dark-gray">────────────────────────────────────────────────────</text>

    <text y="410" class="cyan">  Install JetBrains Rider? </text><text x="202" y="410" class="yellow">[Y/n]</text><text x="248" y="410" class="white">: </text><text x="260" y="410" class="white">Y</text>

    <!-- Rider version sub-prompt -->
    <text y="432" class="white">  Rider version:</text>
    <text y="452" class="yellow">  [1]</text><text x="50" y="452" class="white">  </text><text x="68" y="452" class="cyan">Latest  (recommended)</text>
    <text y="472" class="yellow">  [2]</text><text x="50" y="472" class="white">  </text><text x="68" y="472" class="cyan">Specific version  (e.g. 2024.1)</text>

    <text y="496" class="prompt-arrow">  ❯ </text><text x="40" y="496" class="white">Choice: </text>
    <rect x="116" y="485" width="2" height="14" fill="#F8F8F8" opacity="0.8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

  </g>
</svg>
